name: Email Lead Worker

# Runs the free bulk email extractor / verifier on GitHub's free runners.
# Trigger it from the RankVelt website (Start button) or manually from the Actions tab.
# NOTE: this file must live at .github/workflows/email-worker.yml in the repo root.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'extract or verify'
        required: true
        default: 'extract'
        type: choice
        options: [extract, verify]
      sheet:
        description: 'Google Sheet ID (or full sheet URL)'
        required: true
        type: string
      tab:
        description: 'Sheet tab name'
        required: false
        default: 'Websites'
        type: string
      limit:
        description: 'Max items per run (0 = all). Keep small on big lists, resume picks up the rest.'
        required: false
        default: '0'
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # GitHub max is 360; resume continues the rest on the next run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install worker deps
        working-directory: email-worker
        run: npm ci --no-audit --no-fund

      - name: Run worker
        working-directory: email-worker
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node worker.js --mode=${{ inputs.mode }} --sheet=${{ inputs.sheet }} --tab=${{ inputs.tab }} --limit=${{ inputs.limit }}
